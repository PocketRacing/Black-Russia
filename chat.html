
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK RUSSIA RP — Чат</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0d;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #111113;
      border-bottom: 1px solid #29292d;
    }

    .logo {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff3038;
    }

    a {
      color: #fff;
      text-decoration: none;
    }

    .back {
      padding: 10px 14px;
      background: #202024;
      border-radius: 8px;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 14px;
    }

    .heading {
      margin-bottom: 18px;
    }

    .heading h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .heading p {
      color: #99999f;
      margin: 0;
      font-size: 14px;
    }

    .chat {
      height: min(65vh, 570px);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      background: #121214;
      border: 1px solid #29292d;
      border-radius: 14px;
      overflow: hidden;
    }

    .chat-top {
      padding: 15px;
      background: #18181b;
      border-bottom: 1px solid #29292d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      font-weight: bold;
    }

    .status {
      color: #67db8b;
      font-size: 12px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 11px 13px;
      background: #1c1c20;
      border: 1px solid #29292d;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .message.mine {
      border-left: 3px solid #ff3038;
    }

    .message-head {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin-bottom: 7px;
    }

    .username {
      font-size: 13px;
      font-weight: bold;
      color: #ff555c;
    }

    .time {
      font-size: 11px;
      color: #77777e;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .system-message {
      text-align: center;
      color: #92929a;
      font-size: 13px;
      padding: 12px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 13px;
      background: #18181b;
      border-top: 1px solid #29292d;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      color: white;
      background: #0d0d0f;
      border: 1px solid #343439;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    #messageInput:focus {
      border-color: #ff3038;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 0 19px;
      background: #ed292f;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #notice {
      min-height: 20px;
      margin: 10px 2px;
      font-size: 13px;
      color: #ff7277;
    }

    @media (max-width: 500px) {
      header {
        padding: 0 12px;
      }

      .logo {
        font-size: 15px;
      }

      main {
        margin-top: 20px;
      }

      .heading h1 {
        font-size: 23px;
      }

      .chat {
        height: 68vh;
      }

      .composer {
        padding: 9px;
        gap: 7px;
      }

      button {
        padding: 0 13px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">BLACK <span>RUSSIA</span> RP</div>
    <a class="back" href="index.html">← На главную</a>
  </header>

  <main>
    <div class="heading">
      <h1>Общий чат</h1>
      <p>Общайся с другими игроками сервера</p>
    </div>

    <section class="chat">
      <div class="chat-top">
        <div class="chat-title">💬 Игровой чат</div>
        <div class="status" id="status">Подключение...</div>
      </div>

      <div id="messages">
        <div class="system-message">Загружаем сообщения...</div>
      </div>

      <form class="composer" id="chatForm">
        <input
          id="messageInput"
          type="text"
          maxlength="500"
          placeholder="Напиши сообщение..."
          autocomplete="off"
          required
        >
        <button id="sendButton" type="submit">Отправить</button>
      </form>
    </section>

    <div id="notice"></div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://qzswnoeglovfpgrzpnio.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_k_mSqLmEL-OMvM5x7slx7w_EqR0HXqY";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const noticeEl = document.getElementById("notice");
    const inputEl = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    let currentUser = null;
    let currentUsername = "Игрок";
    let knownMessages = new Set();

    function showNotice(text) {
      noticeEl.textContent = text;
    }

    function formatTime(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function addMessage(row) {
      const id = row.id;

      if (id !== undefined && knownMessages.has(String(id))) {
        return;
      }

      if (id !== undefined) {
        knownMessages.add(String(id));
      }

      const username =
        row.username || row.name || "Игрок";

      const messageText =
        row.message || row.text || "";

      if (!messageText) return;

      const message = document.createElement("div");
      message.className = "message";

      if (currentUser && row.user_id === currentUser.id) {
        message.classList.add("mine");
      }

      const head = document.createElement("div");
      head.className = "message-head";

      const name = document.createElement("span");
      name.className = "username";
      name.textContent = username;

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = formatTime(row.created_at);

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = messageText;

      head.append(name, time);
      message.append(head, text);
      messagesEl.appendChild(message);

      while (messagesEl.children.length > 200) {
        messagesEl.removeChild(messagesEl.firstChild);
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await db
        .from("chat_messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(100);

      if (error) {
        statusEl.textContent = "Ошибка";
        showNotice("Не удалось загрузить чат: " + error.message);
        messagesEl.innerHTML = "";
        return;
      }

      messagesEl.innerHTML = "";
      knownMessages.clear();

      if (!data || data.length === 0) {
        messagesEl.innerHTML =
          '<div class="system-message">Сообщений пока нет. Начни общение!</div>';
        return;
      }

      data.forEach(addMessage);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function startChat() {
      const { data: sessionData, error: sessionError } =
        await db.auth.getSession();

      if (sessionError) {
        showNotice("Не удалось проверить авторизацию.");
        return;
      }

      const session = sessionData.session;

      if (!session) {
        statusEl.textContent = "Не авторизован";
        messagesEl.innerHTML =
          '<div class="system-message">Сначала войди в аккаунт на главной странице.</div>';

        inputEl.disabled = true;
        sendButton.disabled = true;
        showNotice("Перейди на главную и войди в аккаунт.");
        return;
      }

      currentUser = session.user;

      const { data: profile } = await db
        .from("profiles")
        .select("username")
        .eq("id", currentUser.id)
        .maybeSingle();

      currentUsername =
        profile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email?.split("@")[0] ||
        "Игрок";

      await loadMessages();

      const channel = db
        .channel("black-russia-chat")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "chat_messages"
          },
          payload => {
            addMessage(payload.new);
          }
        )
        .subscribe(state => {
          if (state === "SUBSCRIBED") {
            statusEl.textContent = "В сети";
          } else if (state === "CHANNEL_ERROR") {
            statusEl.textContent = "Нет связи";
          }
        });
    }

    document.getElementById("chatForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        if (!currentUser) {
          showNotice("Сначала войди в аккаунт.");
          return;
        }

        const message = inputEl.value.trim();

        if (!message) return;

        sendButton.disabled = true;
        showNotice("");

        const { error } = await db
          .from("chat_messages")
          .insert({
            user_id: currentUser.id,
            username: currentUsername,
            message: message
          });

        sendButton.disabled = false;

        if (error) {
          showNotice("Не удалось отправить: " + error.message);
          return;
        }

        inputEl.value = "";
        inputEl.focus();
      }
    );

    startChat();
  </script>
</body>
</html>
