<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>BLACK RUSSIA — Работы</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#070707;--p:#111;--p2:#181818;--line:#292929;
 --red:#e50914;--red2:#ff2633;--white:#f5f5f5;
 --muted:#777;--green:#31d47a;--yellow:#ffc928;--blue:#3295ff
}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);color:var(--white);
 min-height:100vh;padding-bottom:25px
}
button{border:0;font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.hidden{display:none!important}

.top{
 height:58px;position:sticky;top:0;z-index:50;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 12px;background:rgba(7,7,7,.96);
 border-bottom:1px solid var(--line);backdrop-filter:blur(12px)
}
.logo{font-size:15px;font-weight:1000}
.logo b{color:var(--red)}
.back,.money{
 background:#181818;border:1px solid #303030;
 color:#fff;border-radius:8px;font-weight:900
}
.back{padding:8px 10px;font-size:9px}
.money{padding:6px 8px;font-size:9px}
.money.cash{color:var(--green)}
.money.donate{color:var(--red2)}

.page{max-width:900px;margin:auto;padding:15px}
.title{font-size:25px;font-weight:1000}
.sub{color:var(--muted);font-size:10px;margin:4px 0 14px}

.player{
 display:flex;align-items:center;gap:10px;
 padding:12px;margin-bottom:12px;
 background:linear-gradient(120deg,rgba(229,9,20,.12),transparent 65%),var(--p);
 border:1px solid var(--line);border-radius:12px
}
.avatar{
 width:44px;height:44px;display:flex;align-items:center;
 justify-content:center;background:#202020;
 border:2px solid var(--red);border-radius:50%;
 font-weight:1000
}
.player-main{flex:1}
.player-name{font-size:13px;font-weight:900}
.player-level{color:#777;font-size:9px;margin-top:3px}
.xp{height:4px;background:#292929;border-radius:10px;margin-top:6px;overflow:hidden}
.xp div{height:100%;background:var(--red);width:0}

.busy{
 display:flex;align-items:center;gap:7px;
 padding:9px 11px;margin-bottom:11px;
 background:#141414;border:1px solid #303030;
 border-radius:9px;font-size:9px;color:#aaa
}
.busy b{color:var(--yellow)}

.jobs{
 display:grid;gap:8px
}
.job{
 display:flex;align-items:center;gap:10px;
 padding:11px;background:var(--p);
 border:1px solid var(--line);border-radius:11px;
 transition:.15s
}
.job:active{transform:scale(.985)}
.job.locked{opacity:.48}
.icon{
 width:45px;height:45px;display:flex;align-items:center;
 justify-content:center;flex-shrink:0;background:#1c1c1c;
 border-radius:10px;font-size:23px
}
.jmain{flex:1;min-width:0}
.jname{font-size:12px;font-weight:1000}
.jdesc{color:#777;font-size:9px;margin-top:3px;line-height:1.35}
.jinfo{color:#999;font-size:8px;margin-top:5px}
.open{
 padding:9px 10px;background:var(--red);
 color:#fff;border-radius:7px;font-size:8px;font-weight:1000
}
.open:disabled{background:#303030;color:#777}

.modal{
 position:fixed;inset:0;z-index:100;
 display:flex;align-items:flex-end;justify-content:center;
 background:rgba(0,0,0,.78);padding:9px
}
.box{
 width:100%;max-width:500px;max-height:88vh;overflow:auto;
 background:#121212;border:1px solid #343434;
 border-radius:16px 16px 9px 9px;padding:17px
}
.close{
 float:right;width:29px;height:29px;
 background:#292929;color:#fff;border-radius:50%
}
.modal-icon{font-size:35px;margin-bottom:6px}
.modal-title{font-size:20px;font-weight:1000}
.modal-sub{color:#777;font-size:9px;margin-top:3px}
.modal-desc{
 color:#aaa;font-size:10px;line-height:1.5;
 margin:13px 0
}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);gap:6px
}
.stat{
 padding:9px 5px;text-align:center;
 background:#191919;border:1px solid #292929;border-radius:8px
}
.stat b{display:block;font-size:11px}
.stat span{display:block;color:#666;font-size:7px;margin-top:3px}
.status{
 margin-top:8px;padding:9px;
 background:#0c0c0c;border:1px solid #292929;
 border-radius:8px;color:#999;font-size:9px
}
.status b{color:var(--green)}
.main-btn{
 width:100%;padding:12px;margin-top:9px;
 background:var(--red);color:#fff;border-radius:8px;
 font-size:9px;font-weight:1000
}
.main-btn:disabled{background:#303030;color:#777}

.orders{display:grid;gap:7px;margin-top:10px}
.order{
 padding:10px;background:#181818;
 border:1px solid #292929;border-radius:9px
}
.order-top{display:flex;justify-content:space-between;gap:8px}
.order-name{font-size:10px;font-weight:1000}
.order-price{color:var(--green);font-size:10px;font-weight:900}
.order-info{color:#777;font-size:8px;margin-top:4px}
.order button{
 width:100%;padding:9px;margin-top:7px;
 background:#252525;color:#fff;border-radius:7px;
 font-size:8px;font-weight:900
}

.toast{
 position:fixed;left:50%;bottom:20px;z-index:200;
 transform:translateX(-50%) translateY(15px);
 padding:10px 13px;background:#191919;
 border:1px solid #383838;border-radius:8px;
 font-size:10px;opacity:0;pointer-events:none;
 transition:.2s;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:700px){
 .jobs{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header class="top">

 <button class="back" onclick="goBack()">← НАЗАД</button>

 <div class="logo">BLACK <b>RUSSIA</b></div>

 <div style="display:flex;gap:4px">
  <div class="money cash" id="cash">₽ 0</div>
  <div class="money donate" id="donate">♦ 0</div>
 </div>

</header>

<main class="page">

 <div class="title">Работы</div>

 <div class="sub">
  Выбирай работу, выполняй задания и зарабатывай.
 </div>

 <div class="player">

  <div class="avatar" id="avatar">P</div>

  <div class="player-main">

   <div class="player-name" id="name">Player</div>

   <div class="player-level">
    Уровень <b id="level">1</b> ·
    <span id="xp">0 XP</span>
   </div>

   <div class="xp">
    <div id="xpbar"></div>
   </div>

  </div>

 </div>

 <div class="busy hidden" id="busy">
  ⏳ <span id="busyText">Персонаж занят</span>
 </div>

 <div class="jobs" id="jobs"></div>

</main>


<div class="modal hidden" id="modal">

 <div class="box">

  <button class="close" onclick="closeModal()">×</button>

  <div class="modal-icon" id="mIcon">💼</div>

  <div class="modal-title" id="mTitle">Работа</div>

  <div class="modal-sub" id="mSub"></div>

  <div class="modal-desc" id="mDesc"></div>

  <div class="stats">

   <div class="stat">
    <b id="mReward">—</b>
    <span>ОПЛАТА</span>
   </div>

   <div class="stat">
    <b id="mCooldown">—</b>
    <span>КД</span>
   </div>

   <div class="stat">
    <b id="mLevel">—</b>
    <span>УРОВЕНЬ</span>
   </div>

  </div>

  <div class="status" id="mStatus">
   Статус: <b>Готов</b>
  </div>

  <div id="modalExtra"></div>

  <button
   class="main-btn"
   id="mButton"
   onclick="startSelected()"
  >
   НАЧАТЬ РАБОТУ
  </button>

 </div>

</div>


<div class="toast" id="toast"></div>


<script>

const SUPABASE_URL="https://qzswnoeglovfpgrzpnio.supabase.co";
const SUPABASE_KEY="sb_publishable_k_mSqLmEL-OMvM5x7slx7w_EqR0HXqY";

let user=null;
let jobs=[];
let selected=null;
let toastTimer=null;


/* ================= FETCH ================= */

async function api(path,opt={}){

 const token=localStorage.getItem("brp_access_token");

 const r=await fetch(
  SUPABASE_URL+path,
  {
   ...opt,
   headers:{
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+(token||SUPABASE_KEY),
    "Content-Type":"application/json",
    ...(opt.headers||{})
   }
  }
 );

 const text=await r.text();

 let data=null;

 try{
  data=text?JSON.parse(text):null;
 }catch{
  data=text;
 }

 if(!r.ok)
  throw new Error(
   typeof data==="string"
   ?data
   :JSON.stringify(data)
  );

 return data;
}


/* ================= SESSION ================= */

async function init(){

 const token=localStorage.getItem("brp_access_token");

 if(!token){
  goBack();
  return;
 }

 try{

  const auth=await api(
   "/auth/v1/user",
   {
    headers:{
     apikey:SUPABASE_KEY,
     Authorization:"Bearer "+token
    }
   }
  );

  const rows=await api(
   "/rest/v1/profiles?id=eq."+
   encodeURIComponent(auth.id)+
   "&select=*"
  );

  if(!rows.length)
   throw new Error("Профиль не найден");

  user=rows[0];

  await loadJobs();
  renderPlayer();
  renderJobs();

 }catch(e){

  console.error(e);
  toast("❌ "+clean(e.message));

 }
}


/* ================= PLAYER ================= */

function renderPlayer(){

 const level=Number(user.level||1);
 const xp=Number(user.xp||0);

 name.textContent=user.username||"Player";

 avatar.textContent=
  (user.username||"P").charAt(0).toUpperCase();

 document.getElementById("level").textContent=level;
 document.getElementById("xp").textContent=xp+" XP";

 cash.textContent="₽ "+num(user.cash);
 donate.textContent="♦ "+num(user.donate);

 const need=100+(level-1)*75;

 xpbar.style.width=
  Math.min(100,xp/need*100)+"%";
}


/* ================= JOBS ================= */

async function loadJobs(){

 jobs=await api(
  "/rest/v1/job_settings"+
  "?enabled=eq.true"+
  "&select=*"+
  "&order=min_level.asc"
 );

}


/* ================= JOB DATA ================= */

const data={

 courier:{
  icon:"📦",
  desc:"Доставляй посылки и документы по городу. Чем выше уровень — тем выгоднее заказы."
 },

 loader:{
  icon:"📦",
  desc:"Работа на складе. Загружай и разгружай транспорт с товарами."
 },

 farmer:{
  icon:"🚜",
  desc:"Работа на ферме: собирай урожай и выполняй сельскохозяйственные задания."
 },

 taxi:{
  icon:"🚕",
  desc:"Перевози пассажиров по городу и получай оплату за каждый выполненный заказ."
 },

 bus:{
  icon:"🚌",
  desc:"Работа на городском маршруте. Выполняй рейсы и получай стабильную оплату."
 },

 builder:{
  icon:"👷",
  desc:"Строительные работы на объектах города. Работа требует выносливости и времени."
 },

 mechanic:{
  icon:"🔧",
  desc:"Ремонт автомобилей и обслуживание транспорта."
 },

 truck:{
  icon:"🚛",
  desc:"Получай грузовые заказы, забирай груз со склада и доставляй его в другой город."
 },

 collector:{
  icon:"💰",
  name:"Инкассатор",
  desc:"Получай маршрут по банкам и торговым объектам, забирай денежную выручку и доставляй её в хранилище."
 },

 mchs:{
  icon:"🚒",
  name:"МЧС",
  desc:"Получай вызовы на чрезвычайные ситуации: пожары, ДТП, аварии и другие происшествия."
 },

 diver:{
  icon:"🤿",
  name:"Водолаз",
  desc:"Погружайся и ищи потерянные предметы. Найденные вещи можно продать скупщику."
 }

};


/* ================= RENDER ================= */

function renderJobs(){

 const box=document.getElementById("jobs");
 box.innerHTML="";

 const normal=jobs.filter(x=>
  !["mchs","diver","collector"].includes(x.job_id)
 );

 const special=[
  {
   job_id:"collector",
   job_name:"Инкассатор",
   min_level:8,
   min_reward:2500,
   max_reward:6500,
   cooldown_seconds:900
  },
  {
   job_id:"mchs",
   job_name:"МЧС",
   min_level:5,
   min_reward:3000,
   max_reward:9000,
   cooldown_seconds:600
  },
  {
   job_id:"diver",
   job_name:"Водолаз",
   min_level:8,
   min_reward:0,
   max_reward:35000,
   cooldown_seconds:1800
  }
 ];

 [...normal,...special].forEach(job=>{

  const d=data[job.job_id]||{icon:"💼",desc:"Выполняй задания и получай деньги."};

  const level=Number(user.level||1);
  const req=Number(job.min_level||1);
  const locked=level<req;

  const el=document.createElement("div");

  el.className="job"+(locked?" locked":"");

  el.innerHTML=`

   <div class="icon">${d.icon}</div>

   <div class="jmain">

    <div class="jname">
     ${esc(d.name||job.job_name||"Работа")}
    </div>

    <div class="jdesc">
     ${esc(d.desc)}
    </div>

    <div class="jinfo">
     💰 ${job.job_id==="diver"?"до 35 000":num(job.min_reward)+"–"+num(job.max_reward)+" ₽"}
     · ⏱ ${fmt(job.cooldown_seconds)}
     · ⭐ Ур. ${req}
    </div>

   </div>

   <button
    class="open"
    onclick="openJob('${job.job_id}')"
   >
    ${locked?"🔒":"ОТКРЫТЬ"}
   </button>

  `;

  box.appendChild(el);

 });
}


/* ================= OPEN ================= */

function openJob(id){

 selected=
  jobs.find(x=>x.job_id===id)
  ||
  specialJob(id);

 if(!selected)return;

 const d=data[id]||{
  icon:"💼",
  desc:"Выполняй работу и получай деньги."
 };

 mIcon.textContent=d.icon;
 mTitle.textContent=d.name||selected.job_name||"Работа";

 mSub.textContent=
  "Минимальный уровень: "+
  Number(selected.min_level||1);

 mDesc.textContent=d.desc;

 mReward.textContent=
  id==="diver"
  ?"до 35K ₽"
  :num(selected.min_reward)+"–"+num(selected.max_reward)+" ₽";

 mCooldown.textContent=
  fmt(selected.cooldown_seconds);

 mLevel.textContent=
  "Ур. "+Number(selected.min_level||1);

 modalExtra.innerHTML="";

 if(id==="truck")
  renderTruckOrders();

 if(id==="mchs")
  renderMchsOrders();

 if(id==="collector")
  renderCollector();

 if(id==="diver")
  renderDiver();

 updateModalState();

 modal.classList.remove("hidden");
}


/* ================= SPECIAL ================= */

function specialJob(id){

 const x={
  collector:{
   job_id:"collector",
   job_name:"Инкассатор",
   min_level:8,
   min_reward:2500,
   max_reward:6500,
   cooldown_seconds:900
  },

  mchs:{
   job_id:"mchs",
   job_name:"МЧС",
   min_level:5,
   min_reward:3000,
   max_reward:9000,
   cooldown_seconds:600
  },

  diver:{
   job_id:"diver",
   job_name:"Водолаз",
   min_level:8,
   min_reward:0,
   max_reward:35000,
   cooldown_seconds:1800
  }
 };

 return x[id]||null;
}


/* ================= TRUCK ================= */

function renderTruckOrders(){

 modalExtra.innerHTML=`

  <div style="margin-top:13px;font-size:11px;font-weight:1000">
   🚛 Доступные заказы
  </div>

  <div class="orders">

   ${order(
    "Москва → Тверь",
    "Склад №3 · Продукты",
    "7 800 ₽"
   )}

   ${order(
    "Тверь → Ярославль",
    "Логистический центр · Техника",
    "10 500 ₽"
   )}

   ${order(
    "Москва → Владимир",
    "Оптовая база · Стройматериалы",
    "12 300 ₽"
   )}

   ${order(
    "Рязань → Москва",
    "Торговый центр · Груз",
    "9 400 ₽"
   )}

  </div>
 `;
}

function order(route,info,price){

 return `
  <div class="order">

   <div class="order-top">
    <div class="order-name">🚛 ${route}</div>
    <div class="order-price">${price}</div>
   </div>

   <div class="order-info">${info}</div>

   <button onclick="truckOrder('${route}','${price}')">
    ВЗЯТЬ ЗАКАЗ
   </button>

  </div>
 `;
}

async function truckOrder(route,price){

 closeModal();

 await work("truck");

}


/* ================= MCHS ================= */

function renderMchsOrders(){

 modalExtra.innerHTML=`

  <div style="margin-top:13px;font-size:11px;font-weight:1000">
   🚨 Доступные вызовы
  </div>

  <div class="orders">

   ${mchsOrder("🔥 Пожар в частном доме","Сектор частной застройки")}
   ${mchsOrder("🏢 Возгорание в квартире","Жилой многоквартирный дом")}
   ${mchsOrder("⛽ Возгорание на АЗС","Заправочная станция")}
   ${mchsOrder("🚗 ДТП с возгоранием","Городская трасса")}
   ${mchsOrder("🏭 Пожар на складе","Промышленная зона")}
   ${mchsOrder("🌲 Возгорание лесного массива","Пригородная территория")}

  </div>
 `;
}

function mchsOrder(name,info){

 return `
  <div class="order">

   <div class="order-name">${name}</div>
   <div class="order-info">${info}</div>

   <button onclick="mchsCall('${name}')">
    🚒 ВЫЕХАТЬ
   </button>

  </div>
 `;
}

async function mchsCall(name){

 closeModal();

 try{

  const result=await api(
   "/rest/v1/rpc/complete_mchs",
   {
    method:"POST",
    body:JSON.stringify({
     p_incident_type:incidentType(name)
    })
   }
  );

  await reload();

  openModal(
   "🚒 Вызов выполнен",
   ""
  );

  mDesc.textContent=
   (result.incident||name)+
   "\n\n💰 Получено: "+
   num(result.cash)+" ₽"+
   "\n⭐ Опыт: +"+
   result.xp+" XP";

 }catch(e){

  toast("❌ "+clean(e.message));

 }

}

function incidentType(name){

 if(name.includes("АЗС"))return"gas_station";
 if(name.includes("квартир"))return"apartment";
 if(name.includes("складе"))return"warehouse";
 if(name.includes("ДТП"))return"car";
 if(name.includes("лес"))return"forest";

 return"house";
}


/* ================= COLLECTOR ================= */

function renderCollector(){

 modalExtra.innerHTML=`

  <div class="status">
   💰 Инкассация проходит по маршруту из нескольких точек.
   После завершения маршрута начисляется оплата.
  </div>

  <div class="orders">

   ${collectorOrder("🏦 Банк «Центральный»")}
   ${collectorOrder("🏦 Банк «Городской»")}
   ${collectorOrder("🏪 Сеть магазинов")}
   ${collectorOrder("🛒 Супермаркет")}

  </div>
 `;
}

function collectorOrder(name){

 return `
  <div class="order">
   <div class="order-name">${name}</div>
   <div class="order-info">Забрать денежную выручку и доставить в хранилище.</div>
   <button onclick="startCollector()">НАЧАТЬ МАРШРУТ</button>
  </div>
 `;
}

async function startCollector(){

 closeModal();

 await work("collector");

}


/* ================= DIVER ================= */

function renderDiver(){

 modalExtra.innerHTML=`

  <div class="status">
   🤿 Доступно максимум 2 погружения за смену.
   Найденные предметы сохраняются в инвентаре.
  </div>
 `;
}


/* ================= NORMAL WORK ================= */

async function startSelected(){

 if(!selected)return;

 const id=selected.job_id;

 if(id==="mchs"){

  renderMchsOrders();
  return;

 }

 if(id==="truck"){

  renderTruckOrders();
  return;

 }

 if(id==="collector"){

  renderCollector();
  return;

 }

 if(id==="diver"){

  await dive();
  return;

 }

 await work(id);

}


async function work(id){

 if(!selected)return;

 const req=Number(selected.min_level||1);

 if(Number(user.level||1)<req){

  toast("🔒 Требуется "+req+" уровень");
  return;

 }

 try{

  mButton.disabled=true;
  mButton.textContent="⏳ ВЫПОЛНЯЕМ...";

  const result=await api(
   "/rest/v1/rpc/complete_job",
   {
    method:"POST",
    body:JSON.stringify({
     p_job:id
    })
   }
  );

  closeModal();

  await reload();

  toast(
   "💰 +"+
   num(result.cash)+
   " ₽ · ⭐ +"+
   result.xp+
   " XP"
  );

 }catch(e){

  toast("❌ "+clean(e.message));
  updateModalState();

 }

}


/* ================= DIVER ================= */

async function dive(){

 try{

  mButton.disabled=true;
  mButton.textContent="🤿 ПОГРУЖЕНИЕ...";

  const result=await api(
   "/rest/v1/rpc/start_diver_dive",
   {method:"POST"}
  );

  await reload();

  let text=
   "Погружение №"+
   result.dive+
   " завершено.";

  const items=result.items||{};

  Object.keys(items).forEach(k=>{
   if(items[k])
    text+="\n"+k+" ×"+items[k];
  });

  closeModal();

  showResult(
   "🤿 Находки",
   text
  );

 }catch(e){

  toast("❌ "+clean(e.message));
  updateModalState();

 }

}


/* ================= MODAL STATE ================= */

function updateModalState(){

 const level=Number(user.level||1);
 const req=Number(selected.min_level||1);

 if(level<req){

  mStatus.innerHTML=
   "Статус: <b style='color:var(--red)'>Недоступно</b>";

  mButton.disabled=true;
  mButton.textContent="🔒 ТРЕБУЕТСЯ УРОВЕНЬ "+req;

  return;
 }

 mStatus.innerHTML=
  "Статус: <b>Готов к работе</b>";

 mButton.disabled=false;

 if(selected.job_id==="truck")
  mButton.textContent="🚛 ВЫБРАТЬ ЗАКАЗ";

 else if(selected.job_id==="mchs")
  mButton.textContent="🚒 ВЫБРАТЬ ВЫЗОВ";

 else if(selected.job_id==="collector")
  mButton.textContent="💰 ВЫБРАТЬ МАРШРУТ";

 else if(selected.job_id==="diver")
  mButton.textContent="🤿 НАЧАТЬ ПОГРУЖЕНИЕ";

 else
  mButton.textContent="НАЧАТЬ РАБОТУ";
}


/* ================= RELOAD ================= */

async function reload(){

 const rows=await api(
  "/rest/v1/profiles?id=eq."+
  encodeURIComponent(user.id)+
  "&select=*"
 );

 if(rows.length){

  user=rows[0];
  renderPlayer();
 }

}


/* ================= RESULT ================= */

function showResult(title,text){

 selected={
  job_id:"result",
  min_level:1,
  min_reward:0,
  max_reward:0,
  cooldown_seconds:0
 };

 mIcon.textContent="✅";
 mTitle.textContent=title;
 mSub.textContent="";
 mDesc.textContent=text;

 mReward.textContent="—";
 mCooldown.textContent="—";
 mLevel.textContent="—";

 modalExtra.innerHTML="";

 mStatus.innerHTML="Статус: <b>Готово</b>";

 mButton.disabled=true;
 mButton.textContent="ЗАКРЫТЬ";

 mButton.onclick=closeModal;

 modal.classList.remove("hidden");
}


/* ================= HELPERS ================= */

function num(v){

 return Number(v||0).toLocaleString("ru-RU");

}

function fmt(sec){

 sec=Number(sec||0);

 if(sec<60)return sec+" сек.";

 const m=Math.floor(sec/60);

 if(m<60)return m+" мин.";

 const h=Math.floor(m/60);

 return h+" ч.";
}

function esc(t){

 return String(t||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function clean(t){

 if(!t)return"Неизвестная ошибка";

 if(t.includes("JOB_COOLDOWN:")){

  const m=t.match(/JOB_COOLDOWN:(\d+)/);

  return"Работа на КД. Осталось "+
   fmt(m?m[1]:0);

 }

 if(t.includes("JOB_LEVEL_REQUIRED:")){

  const m=t.match(/JOB_LEVEL_REQUIRED:(\d+)/);

  return"Требуется уровень "+
   (m?m[1]:"выше");

 }

 if(t.includes("PLAYER_BUSY"))
  return"Персонаж уже занят другой работой.";

 if(t.includes("DIVER_COOLDOWN"))
  return"Доступно только 2 погружения за смену.";

 return t.replace(/[{}\[\]"]/g,"").slice(0,220);

}

function toast(text){

 const e=document.getElementById("toast");

 e.textContent=text;
 e.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(
  ()=>e.classList.remove("show"),
  2800
 );

}

function closeModal(){

 modal.classList.add("hidden");

 mButton.onclick=startSelected;

}

function goBack(){

 location.href="index.html";

}


/* ================= START ================= */

document.addEventListener(
 "DOMContentLoaded",
 init
);

</script>
