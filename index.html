<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BLACK RUSSIA - Simple Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: sans-serif; background: #222; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #333; padding: 25px; border-radius: 8px; width: 350px; box-shadow: 0 0 15px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #ff4d4d; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #444; color: white; border: 1px solid #666; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #f0f0f0; }
        .hidden { display: none; }
        #log { margin-top: 15px; font-size: 13px; line-height: 1.4; min-height: 60px; text-align: left; border: 1px solid #555; padding: 10px; border-radius: 4px; background: #000; color: #0f0; }
        .err { color: #f00; font-weight: bold; }
        .ok { color: #0f0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Вход / Регистрация</h2>
        <input type="email" id="email" placeholder="Email (например, test@test.com)">
        <input type="password" id="pass" placeholder="Пароль (6+ символов)">
        
        <button onclick="register()">Создать аккаунт</button>
        <button onclick="login()" style="background:#444; color:white; margin-top:10px;">Войти</button>

        <div id="log"></div>
    </div>

    <script>
        // ================= ВСТАВЬ КЛЮЧ ЗДЕСЬ =================
        const SUPABASE_URL = 'https://qyjvkiusyiylckaujjiv.supabase.co';
        const SUPABASE_ANON_KEY = 'ВСТАВЬ_СЮДА_ANON_КЛЮЧ'; 
        // =====================================================

        let supabase;

        function log(msg, type = '') {
            const el = document.getElementById('log');
            el.innerHTML += `<div class="${type}">${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        async function init() {
            if (SUPABASE_ANON_KEY === 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5anZraXVzeWl5bGNrYXVqaml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTk5NzksImV4cCI6MjEwMjU3NTk3OX0.rNZX3L-LET6tHe3juirf2DI7cuKOhSEcReXSUHhoSjI') {
                log('❌ ОШИБКА: Ты не вставил ключ! Зайди в Settings -> API, возьми anon key и вставь в код.', 'err');
                return;
            }
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            log('✅ Клиент Supabase инициализирован.', 'ok');
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            
            if (!email || !password || password.length < 6) {
                log('❌ Email и пароль обязательны. Пароль минимум 6 символов.', 'err');
                return;
            }

            log(`🔄 Попытка регистрации для: ${email}...`);

            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                
                if (error) {
                    log(`❌ Ошибка регистрации: ${error.message}`, 'err');
                    return;
                }

                if (data.user_requires_verification) {
                    log('⚠️ Аккаунт создан, но требует подтверждения почты. Для теста лучше отключи эту опцию в настройках Auth.', 'err');
                    return;
                }

                log('✅ Аккаунт успешно создан! Теперь нажми "Войти".', 'ok');
            } catch (e) {
                log(`❌ Критическая ошибка: ${e.message}`, 'err');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            log(`🔄 Вход для: ${email}...`);

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    log(`❌ Ошибка входа: ${error.message}`, 'err');
                    return;
                }

                // Ждем 1.5 сек, чтобы триггер создал строки в таблицах profiles/wallets
                setTimeout(async () => {
                    const { data: { user } } = supabase.auth.getUser();
                    if (user) {
                        log('✅ Пользователь авторизован. Читаем данные из таблиц...', 'ok');
                        
                        // Читаем таблицы
                        const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                        const { data: wallet } = await supabase.from('wallets').select('*').eq('player_id', user.id).single();
                        const { data: stats } = await supabase.from('stats').select('*').eq('user_id', user.id).single();

                        if (profile && wallet && stats) {
                            log(`🎉 УСПЕХ! Игрок создан.`, 'ok');
                            log(`Ник: ${profile.username || 'Не задан'}`, '');
                            log(`Cash: ${wallet.cash}, Bank: ${wallet.bank}, Level: ${stats.level}`, '');
                        } else {
                            log('❌ Ошибка: Не удалось найти данные в таблицах. Возможно, триггер не сработал или политики RLS блокируют доступ.', 'err');
                        }
                    } else {
                        log('❌ Не удалось получить данные пользователя.', 'err');
                    }
                }, 1500);

            } catch (e) {
                log(`❌ Критическая ошибка входа: ${e.message}`, 'err');
            }
        }

        init();
    </script>
</body>
</html>
