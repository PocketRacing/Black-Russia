<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BLACK RUSSIA - Auth Test</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1d; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2c2c30; padding: 30px; border-radius: 12px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        h2 { margin-top: 0; color: #ff4757; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1e1e21; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ff4757; }
        button { width: 100%; padding: 12px; background: #fff; color: #1e1e21; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #f1f1f1; transform: scale(1.02); }
        .btn-secondary { background: transparent; border: 1px solid #ff4757; color: #ff4757; margin-top: 10px; }
        .btn-secondary:hover { background: #ff4757; color: white; }
        .hidden { display: none; }
        #msg { margin-top: 15px; font-size: 14px; min-height: 20px; font-weight: bold; }
        .success { color: #2ed573; }
        .error { color: #ff4757; }
        
        /* Стили игрового экрана */
        .game-stats { display: flex; justify-content: space-around; margin: 20px 0; padding: 15px; background: #3a3a40; border-radius: 8px; }
        .stat-box strong { display: block; font-size: 12px; color: #aaa; }
        .stat-val { font-size: 18px; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="authScreen" class="container">
        <h2>BLACK RUSSIA RP</h2>
        <input type="email" id="email" placeholder="Email (для регистрации/входа)">
        <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
        
        <button onclick="register()">СОЗДАТЬ АККАУНТ</button>
        <button onclick="login()" class="btn-secondary">ВОЙТИ</button>
        
        <div id="msg"></div>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div id="gameScreen" class="container hidden">
        <h3 id="welcomeText" style="color: #2ed573;"></h3>
        <p id="statusText" style="color: #aaa; margin-bottom: 20px;"></p>
        
        <div class="game-stats">
            <div class="stat-box">
                <strong>CASH</strong>
                <span class="stat-val" id="cashVal">0</span>
            </div>
            <div class="stat-box">
                <strong>BANK</strong>
                <span class="stat-val" id="bankVal">0</span>
            </div>
            <div class="stat-box">
                <strong>LEVEL</strong>
                <span class="stat-val" id="levelVal">1</span>
            </div>
        </div>

        <button onclick="logout()" style="background: #ff4757; color: white;">ВЫЙТИ ИЗ АККАУНТА</button>
    </div>

    <script>
        // ================= НАСТРОЙКИ (ВСТАВИТЬ СЮДА) =================
        const SUPABASE_URL = 'https://qyjvkiusyiylckaujjiv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5anZraXVzeWl5bGNrYXVqaml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTk5NzksImV4cCI6MjEwMjU3NTk3OX0.rNZX3L-LET6tHe3juirf2DI7cuKOhSEcReXSUHhoSjI'; 
        // =============================================================

        let supabase;

        async function init() {
            if (!SUPABASE_URL || SUPABASE_ANON_KEY === 'ВСТАВЬ_СЮДА_ANON_КЛЮЧ') {
                document.getElementById('msg').innerHTML = '<span class="error">⚠️ Ошибка: Не вставлен ключ Supabase!</span>';
                return;
            }
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // Проверяем, залогинен ли пользователь при загрузке страницы
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                showGameScreen(user);
            }
        }

        // --- РЕГИСТРАЦИЯ ---
        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            if (!email || !password || password.length < 6) {
                msg.innerHTML = '<span class="error">❌ Email и пароль обязательны (пароль от 6 символов).</span>';
                return;
            }

            msg.innerText = 'Регистрация...';
            
            try {
                const { data, error } = await supabase.auth.signUp({ email, password });

                if (error) {
                    msg.innerHTML = `<span class="error">❌ Ошибка: ${error.message}</span>`;
                    return;
                }

                if (data.user_requires_verification) {
                    msg.innerHTML = '<span class="error">⚠️ Подтвердите email в письме!</span>';
                    return;
                }

                msg.innerHTML = '<span class="success">✅ Аккаунт создан! Теперь войдите.</span>';
            } catch (err) {
                msg.innerHTML = `<span class="error">❌ ${err.message}</span>`;
            }
        }

        // --- ВХОД ---
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            if (!email || !password) {
                msg.innerHTML = '<span class="error">❌ Введите данные!</span>';
                return;
            }

            msg.innerText = 'Вход...';

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    // Частая ошибка: "Invalid login credentials"
                    msg.innerHTML = `<span class="error">❌ Ошибка входа: ${error.message}</span>`;
                    return;
                }

                // ВАЖНО: Ждем 1.5 секунды, чтобы триггер успел создать строки в таблицах profiles/wallets
                setTimeout(async () => {
                    const { data: { user } } = supabase.auth.getUser();
                    if (user) {
                        showGameScreen(user);
                    } else {
                        msg.innerHTML = '<span class="error">❌ Не удалось получить данные пользователя.</span>';
                    }
                }, 1500);

            } catch (err) {
                msg.innerHTML = `<span class="error">❌ ${err.message}</span>`;
            }
        }

        // --- ОТОБРАЖЕНИЕ ИГРЫ ---
        async function showGameScreen(user) {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            try {
                // 1. Получаем профиль (никнейм)
                const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                
                // 2. Получаем кошелек
                const { data: wallet } = await supabase.from('wallets').select('*').eq('player_id', user.id).single();

                // 3. Получаем статистику
                const { data: stats } = await supabase.from('stats').select('*').eq('user_id', user.id).single();

                // Заполняем данные на экране
                const nickname = profile?.username || 'Игрок';
                document.getElementById('welcomeText').innerText = `Привет, ${nickname}!`;
                document.getElementById('statusText').innerText = profile?.created_at ? 'Статус: Активен' : 'Статус: Новый аккаунт';
                
                document.getElementById('cashVal').innerText = wallet?.cash || 0;
                document.getElementById('bankVal').innerText = wallet?.bank || 0;
                document.getElementById('levelVal').innerText = stats?.level || 1;

            } catch (error) {
                console.error(error);
                document.getElementById('msg').innerHTML = `<span class="error">❌ Ошибка загрузки данных: ${error.message}</span>`;
                // Возвращаем экран входа, если ошибка критическая
                setTimeout(() => {
                    document.getElementById('gameScreen').classList.add('hidden');
                    document.getElementById('authScreen').classList.remove('hidden');
                }, 3000);
            }
        }

        // --- ВЫХОД ---
        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        init();
    </script>
</body>
</html>
